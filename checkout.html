<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="checkout-style.css">
    <link href="https://fonts.cdnfonts.com/css/beatrice-display-trial" rel="stylesheet">
</head>
<body class="cp">
    <div class="main-container">
        <header>
            <img class = "forward-arrow" src="icons/right-arrow.png">
        </header>
        
        <section class="titles">
            <h1>CHECKOUT</h1>
            <div class="container">
                <p>INFORMATION</p>
                <p>SHIPPING</p>
                <p>PAYMENT</p>
            </div>
        </section>
        
        <section class="products">
            <div class="container">
                <div class="left-part">
                    <form name = "myForm">
                        <h3>CONTACT INFO</h3>
                        <input type="email" placeholder="Email" id="email" required>
                        <input type="tel" placeholder="Phone" id =tel>
                        <h3 class="sa-title">SHIPPING ADDRESS</h3>
                        <div class="name">
                            <input type="text" placeholder="First Name" id="fName">
                            <input type="text" placeholder="Last Name" id="lName">
                        </div>
                        <input type="text" placeholder="Country" id="country">
                        <input type="text" placeholder="State/Religion" id="state">
                        <input type="text" placeholder="Address" id="address">
                        <div class="city-p">
                            <input type="text" placeholder="City" id="city">
                            <input type="text" placeholder="Postal Code" id="postal">
                        </div>
                    </form>
                     
                    <button>
                        Shipping
                        <img src="icons/right-arrow.png">
                    </button>
                </div>

                <div class="right-part">
                    <h3>YOUR ORDER</h3>

                    <div class="products-area">
                        <div class="product-container">
                            <img class="product-img" src="images/buyyed-product.jpg">
                            <div class="product-d">
                                <div>
                                    <p class="product-t">Basic Heavy T-Shirt</p>
                                    <p class="product-s">Black/L</p>
                                </div>
                                <div class="amount-co">
                                    <p class="amount">(1)</p>
                                    <p class="cost">$99</p>
                                </div>
                            </div>  
                        </div>
                        

                        <div class="product-container">
                            <img class = "product-img"src="images/black-clothes.jpg">
                            <div class="product-d">
                                <div>
                                    <p class="product-t">Basic Fit T-Shirt</p>
                                    <p class="product-s">Black/L</p>
                                </div>
                                <div class="amount-co">
                                    <p class="amount">(1)</p>
                                    <p class="cost">$99</p>
                                </div>
                            </div>  
                        </div>
                    </div>
                    
                    <div class="t-amount">
                        <p>(2)</p>
                    </div>

                    <p class="sub-t">Subtotal<span class="t-cost">$180.00</span></p>
                    <p class="shipping">Shipping<span>Calculate at next step</span></p>
                    <p class="total">Total<span class="total-c">$180</span></p>
                </div>
            </div>  
        </section>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
