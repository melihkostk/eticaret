<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/beatrice-display-trial" rel="stylesheet">
</head>
<body class="cp">
    <div class="cp-main-container">
        <header>
            <img class = "cp-forward-arrow" src="icons/right-arrow.png">
        </header>
        
        <section class="cp-titles">
            <h1>CHECKOUT</h1>
            <div class="cp-container">
                <p>INFORMATION</p>
                <p>SHIPPING</p>
                <p>PAYMENT</p>
            </div>
        </section>
        
        <section class="cp-products">
            <div class="cp-container">
                <div class="cp-left-part">
                    <form name = "cp-myForm">
                        <h3>CONTACT INFO</h3>
                        <input type="email" placeholder="Email" id="email" required>
                        <input type="tel" placeholder="Phone" id =tel>
                        <h3 class="cp-sa-title">SHIPPING ADDRESS</h3>
                        <div class="cp-name">
                            <input type="text" placeholder="First Name" id="fName">
                            <input type="text" placeholder="Last Name" id="lName">
                        </div>
                        <input type="text" placeholder="Country" id="country">
                        <input type="text" placeholder="State/Religion" id="state">
                        <input type="text" placeholder="Address" id="address">
                        <div class="cp-city-p">
                            <input type="text" placeholder="City" id="city">
                            <input type="text" placeholder="Postal Code" id="postal">
                        </div>
                    </form>
                     
                    <button>
                        Shipping
                        <img src="icons/right-arrow.png">
                    </button>
                </div>

                <div class="cp-right-part">
                    <h3>YOUR ORDER</h3>

                    <div class="cp-products-area">
                        <div class="cp-product-container">
                            <img class="cp-product-img" src="images/buyyed-product.jpg">
                            <div class="cp-product-d">
                                <div>
                                    <p class="cp-product-t">Basic Heavy T-Shirt</p>
                                    <p class="cp-product-s">Black/L</p>
                                </div>
                                <div class="cp-amount-co">
                                    <p class="cp-amount">(1)</p>
                                    <p class="cp-cost">$99</p>
                                </div>
                            </div>  
                        </div>
                        

                        <div class="cp-product-container">
                            <img class = "cp-product-img"src="images/black-clothes.jpg">
                            <div class="cp-product-d">
                                <div>
                                    <p class="cp-product-t">Basic Fit T-Shirt</p>
                                    <p class="cp-product-s">Black/L</p>
                                </div>
                                <div class="cp-amount-co">
                                    <p class="cp-amount">(1)</p>
                                    <p class="cp-cost">$99</p>
                                </div>
                            </div>  
                        </div>
                    </div>
                    
                    <div class="cp-t-amount">
                        <p>(2)</p>
                    </div>

                    <p class="cp-sub-t">Subtotal<span class="t-cost">$180.00</span></p>
                    <p class="cp-shipping">Shipping<span>Calculate at next step</span></p>
                    <p class="cp-total">Total<span class="total-c">$180</span></p>
                </div>
            </div>  
        </section>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
