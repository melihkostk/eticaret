<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/beatrice-display-trial" rel="stylesheet">
</head>
<body class="sbp">
    <div class="sbp-main-container">
        <header class ="head"></header>
        <div class="drawer">
            <img class="close-menu" src="icons/arrow-back.png">
            <a href="index.html">Home</a>
            <a href="products.html">Collections</a>
            <a href="products.html">New</a>
            <a href="shopping-bag-page.html">Shopping Bag</a>
            <a href="shopping-bag-page.html">Favorites</a>
        </div>
        <section class="sbp-bag">
            <div class="sbp-sb-title">
                    <p class="sbp-sb">SHOPPING BAG</p>
                    <img class="sbp-fav-icon" src="icons/black-favorite-icon.png">
                    <p class="sbp-fav">FAVOURITES</p>
                </div>


            <div class="sbp-container"> 
                <div class="sbp-left-part">
                    <div class="sbp-product-container">
                        <img class = "sbp-product-img"src="images/buyyed-product.jpg">
                        <p class="sbp-product-t">Cotton T Shirt</p>
                        <div class="sbp-p-info">
                            <p class="sbp-product-d">Full Sleeve Zipper</p>
                            <p class="sbp-cost">$99</p>
                        </div>
                    </div>

                    <div class="sbp-transaction">
                        <img class="sbp-close-icon" src="icons/close-icon.png">
                        <p class="sbp-size">L</p>
                        <div class="sbp-color-box"></div>
                        
                        <div class="sbp-buttons">    
                            <button class="sbp-increase">+</button>
                            <div class="sbp-amount">1</div>
                            <button class="sbp-decrease">-</button>
                        </div>
                            <img class="sbp-refresh-icon" src="icons/refresh.png">
                    </div>

                    <div class="sbp-product-container">
                        <img class="sbp-product-img" src="images/buyyed-product2.jpg">
                        <p class="sbp-product-t">Cotton T Shirt</p>
                        <div class="sbp-p-info">
                            <p class="sbp-product-d">Basic Slim Fit T-Shirt</p>
                            <p class="sbp-cost">$99</p>
                        </div>
                    </div>

                    <div class="sbp-transaction">
                        <img class="sbp-close-icon" src="icons/close-icon.png">
                        <p class="sbp-size">L</p>
                        <div class="sbp-color-box"></div>
                        
                        <div class="sbp-buttons">
                            <button class="sbp-increase">+</button>
                            <div class="sbp-amount">1</div>
                            <button class="sbp-decrease">-</button>
                        </div>
                        <img class="sbp-refresh-icon" src="icons/refresh.png">
                    </div>
                </div>

                <div class="sbp-right-part">
                    <h3>ORDER SUMMARY</h3>
                    <p class="sbp-subt">Subtotal<span class="sbp-sub-total">$180</span></p>
                    <p class="sbp-shp">Shipping<span class="sbp-shipping">$10</span></p>
                    <hr>
                    <h3 class="sbp-ttl">TOTAL<span class="sbp-tax-inc">(TAX INCL.)</span><span class="sbp-total">$190</span></h3>
                    
                    <input type="checkbox" id="accept">
                    <label for ="accept">I agree to the Terms and Conditions</label>
                    <button class="sbp-continue-button">CONTINUE</button>

                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
