<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="shopping-bag-page-style.css">
    <link href="https://fonts.cdnfonts.com/css/beatrice-display-trial" rel="stylesheet">
</head>
<body class="sbp">
    <div class="main-container">
        <header class ="head"></header>

        <section class="bag">
            <div class="sb-title">
                    <p class="sb">SHOPPING BAG</p>
                    <img class="fav-icon" src="icons/black-favorite-icon.png">
                    <p class="fav">FAVOURITES</p>
                </div>


            <div class="container"> 
                <div class="left-part">
                    <div class="product-container">
                        <img class = "product-img"src="images/buyyed-product.jpg">
                        <p class="product-t">Cotton T Shirt</p>
                        <div class="p-info">
                            <p class="product-d">Full Sleeve Zipper</p>
                            <p class="cost">$99</p>
                        </div>
                    </div>

                    <div class="transaction">
                        <img class="close-icon" src="icons/close-icon.png">
                        <p class="size">L</p>
                        <div class="color-box"></div>
                        
                        <div class="buttons">    
                            <button class="increase">+</button>
                            <div class="amount">1</div>
                            <button class="decrease">-</button>
                        </div>
                            <img class="refresh-icon" src="icons/refresh.png">
                    </div>

                    <div class="product-container">
                        <img class="product-img" src="images/buyyed-product2.jpg">
                        <p class="product-t">Cotton T Shirt</p>
                        <div class="p-info">
                            <p class="product-d">Basic Slim Fit T-Shirt</p>
                            <p class="cost">$99</p>
                        </div>
                    </div>

                    <div class="transaction">
                        <img class="close-icon" src="icons/close-icon.png">
                        <p class="size">L</p>
                        <div class="color-box"></div>
                        
                        <div class="buttons">
                            <button class="increase">+</button>
                            <div class="amount">1</div>
                            <button class="decrease">-</button>
                        </div>
                        <img class="refresh-icon" src="icons/refresh.png">
                    </div>
                </div>

                <div class="right-part">
                    <h3>ORDER SUMMARY</h3>
                    <p class="subt">Subtotal<span class="sub-total">$180</span></p>
                    <p class="shp">Shipping<span class="shipping">$10</span></p>
                    <hr>
                    <h3 class="ttl">TOTAL<span class="tax-inc">(TAX INCL.)</span><span class="total">$190</span></h3>
                    
                    <input type="checkbox" id="accept">
                    <label for ="accept">I agree to the Terms and Conditions</label>
                    <button class="continue-button">CONTINUE</button>

                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
