<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--<link rel="stylesheet" href="products-page-style.css">-->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/beatrice-display-trial" rel="stylesheet">
</head>
<body class="pp">
    <div class="main-container">
        
        <header class ="head"></header>
        <div class="drawer">
            <img class="pp-close-menu" src="icons/arrow-back.png">
            <a href="index.html">Home</a>
            <a href="products.html">Collections</a>
            <a href="products.html">New</a>
            <a href="shopping-bag-page.html">Shopping Bag</a>
            <a href="shopping-bag-page.html">Favorites</a>
        </div>

        <section class="pp-product">
            <div class="pp-container">
                <div class="pp-left-part">
                    <img class = "pp-photo" src="images/black-clothes.jpg">
                    <div class="pp-small-images">
                        <img src="images/black-clothes.jpg">
                        <img src="images/small-image2.jpg">
                        <img src="images/small-image3.jpg">
                        <img src="images/small-image4.jpg">
                        <img src="images/small-image5.jpg">
                    </div>    
                </div>

                <div class="pp-right-part">
                    <h3 class="pp-product-title">ABSTRACT PRINT SHIRT</h3>
                    <p class="pp-cost">$99</p>
                    <p class="pp-tax">MRP incl. of all taxes</p>

                    <p class="pp-description">Relaxed-fit shirt. Camp collar and short sleeves. Button-up front.</p>

                    <p class="pp-color-title">Color</p>
                    
                    <div class="pp-colors">
                        <label class="pp-cream-box">
                            <input type="checkbox" name="color" value="cream">
                            <span></span>
                        </label>

                        <label class="pp-grey-box">
                            <input type="checkbox" name="color" value="grey">
                            <span></span>
                        </label>

                        <label class="pp-black-box">
                            <input type="checkbox" name="color" value="black">
                            <span></span>
                        </label>

                        <label class="pp-green-box">
                            <input type="checkbox" name="color" value="green">
                            <span></span>
                        </label>

                        <label class="pp-white-box">
                            <input type="checkbox" name="color" value="white">
                            <span></span>
                        </label>

                        <label class="pp-blue-box">
                            <input type="checkbox" name="color" value="blue">
                            <span></span>
                        </label> 
                    </div>
                    
                    <p class="pp-size-title">Size</p>
                    <div class="pp-size">
                        <label class="pp-size-xs">
                            <input type="checkbox" name="size" value="S">
                            <span>XS</span>
                        </label>

                        <label class="pp-size-s">
                            <input type="checkbox" name="size" value="M">
                            <span>S</span>
                        </label>

                        <label class="pp-size-m">
                            <input type="checkbox" name="size" value="L">
                            <span>M</span>
                        </label>

                        <label class="pp-size-l">
                            <input type="checkbox" name="size" value="XL">
                            <span>L</span>
                        </label>

                        <label class="pp-size-xl">
                            <input type="checkbox" name="size" value="XXL">
                            <span>XL</span>
                        </label>

                        <label class="pp-size-xx">
                            <input type="checkbox" name="size" value="XXL">
                            <span>2X</span>
                        </label>
                        
                    </div>
                    
                    <p class="pp-measure">FIND YOUR SIZE |  MEASUREMENT GUIDE</p>

                    <button class="pp-add-button">ADD</button>
                    <img class="pp-black-fav-icon" src="icons/black-favorite-icon.png">
                </div>

                
            </div>
        </section>
    </div>

    <br><br><br>
    <script src="script.js"></script>
</body>
</html>
